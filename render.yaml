services:
  - type: cron
    name: rainsignal-daily
    runtime: python
    plan: starter
    # 06:00 UTC = 08:00 CEST / 07:00 CET. Sleep-friendly compromise — gives
    # up roughly 10-20% of the D+0 morning edge premium (vs 04 UTC) for the
    # user being awake and able to act on signals. Still 6h before US-East
    # desks wake at ~12 UTC, so most cheap mispricings are intact. D+1..D+3
    # markets are essentially unaffected by this shift.
    schedule: "0 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/run_and_commit.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GH_REPO
        value: sdnwrd/rainsignal
      # Secrets — set these in the Render dashboard, NOT in this file:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NWS_USER_AGENT
        sync: false
      - key: GH_TOKEN
        sync: false

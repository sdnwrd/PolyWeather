services:
  - type: cron
    name: rainsignal-daily
    runtime: python
    plan: starter
    # 05:00 UTC = 07:00 CEST / 06:00 CET. Middle ground between 04 UTC
    # (max D+0 edge but painful wake-up) and 06 UTC (sleep-friendly but
    # Asian cities at 14:00 local are past peak). At 05 UTC, Asian cities
    # are at 13:00 local — just before peak. US is asleep. UK/Europe is
    # pre-workday. Costs the user a 1h earlier alarm vs 06 UTC, gains
    # ~50% of the edge premium back.
    schedule: "0 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/run_and_commit.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GH_REPO
        value: sdnwrd/rainsignal
      # Secrets — set these in the Render dashboard, NOT in this file:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NWS_USER_AGENT
        sync: false
      - key: GH_TOKEN
        sync: false

name: manual-scan

# Scheduled runs moved to Render Cron (see render.yaml) — Render fires
# punctually at 04:00 UTC; GitHub Actions cron drifts 1-3h which loses
# the early-bird edge before US trading desks wake up. This workflow
# is retained for manual one-off runs from the GitHub UI.
on:
  workflow_dispatch:

# Allow the job to commit the updated CSV back to the repo
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        run: python main.py --now

      - name: Commit updated paper-trade log
        run: |
          if [ -n "$(git status --porcelain data/signals.csv 2>/dev/null)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/signals.csv
            git commit -m "log: signals + backfill $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no signals.csv changes to commit"
          fi
